services:
  neo4j:
    build:
      context: docker
      dockerfile: neo4j.Dockerfile
    container_name: fraud-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/random123
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "random123", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-app
    ports:
      - "8501:8501"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      # Neo4j — points to the compose service, not localhost
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: random123

      # AWS Bedrock (bearer token auth — no access key / secret key needed)
      AWS_BEARER_TOKEN_BEDROCK: ABSKQmVkcm9ja0FQSUtleS1iNWc3LWF0LTc2NjM3NzQyOTIwMjpIUGF2REltT1hZbnEyUVVYbTJrQjFuaDJMaENHZm5xazNZdTdlenRMMUdGRGpyTmpPelVHaHJOUFJjaz0=
      AWS_REGION: ap-south-1
      BEDROCK_MODEL_ID: in.anthropic.claude-sonnet-5

volumes:
  neo4j-data:
