services:
  neo4j:
    build:
      context: docker
      dockerfile: neo4j.Dockerfile
    container_name: fraud-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/random123
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "random123", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-app
    ports:
      - "8501:8501"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      # Neo4j — points to the compose service, not localhost
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: random123

      # AWS Bedrock — loaded from .env file (never hardcode credentials here)
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-in.anthropic.claude-sonnet-5}

